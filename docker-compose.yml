services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quotex_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_DB: quotex_ai
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://quotex_ai:${POSTGRES_PASSWORD:-changeme_local_only}@db:5432/quotex_ai
    ports:
      - "8000:8000"
    depends_on:
      - db

  # Frontend roda melhor localmente com `npm run dev` (hot reload) ou na
  # Vercel em produção. Serviço opcional para rodar tudo em Docker também.
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
